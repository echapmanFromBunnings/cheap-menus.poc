<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    /* Override all Jekyll theme container constraints */
    .container, .page-header, .main-content, .site-footer, main, #main, .wrapper, .site-wrapper, .page-content {
      max-width: none !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
    }
    
    * {
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
