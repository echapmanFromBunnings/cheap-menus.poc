<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: 'Courier New', monospace;
    padding: 50px;
    background: #FFE8E8;
  }
  .url-preview {
    background: #4A1F1F;
    color: #FFE8E8;
    padding: 25px;
    border-radius: 12px;
    font-family: 'Courier New', monospace;
    font-size: 1.2em;
    word-break: break-all;
    line-height: 1.8;
    margin-top: 20px;
    border: 4px solid #D4A574;
  }
  
  .url-preview a {
    color: #FFE8E8;
    text-decoration: underline;
  }
  
  .url-preview a:hover {
    color: #FFD5D5;
    text-decoration: underline;
  }
  
  .action-btn {
    background: linear-gradient(45deg, #C85A7A, #D4A574);
    color: white;
    font-size: 1.6em;
    font-weight: bold;
    padding: 20px 40px;
    border-radius: 15px;
    border: 4px solid #4A1F1F;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
    box-shadow: 5px 5px 0px #4A1F1F;
    margin: 10px;
  }
</style>
</head>
<body>
  <h1 style="color: #C85A7A;">URL Builder Test - Safe DOM Methods</h1>
  
  <h2>Generated URL:</h2>
  <div class="url-preview" id="urlPreview"></div>
  
  <button class="action-btn" onclick="generateUrl()">Generate URL</button>
  
  <script>
    function generateUrl() {
      const baseUrl = 'https://echapmanfrombunnings.github.io/cheap-menus.poc';
      const url = new URL(baseUrl + '/5.html');
      url.searchParams.set('slides', '5,6,7,8');
      url.searchParams.set('transition', '20,20,20,20');
      url.searchParams.set('kiosk', 'true');
      
      // Display URL as clickable link using safe DOM methods
      const urlString = url.toString();
      const urlPreview = document.getElementById('urlPreview');
      urlPreview.innerHTML = '';
      const link = document.createElement('a');
      link.href = urlString;
      link.target = '_blank';
      link.textContent = urlString;
      urlPreview.appendChild(link);
    }
    
    // Generate on load
    window.onload = generateUrl;
  </script>
</body>
</html>
